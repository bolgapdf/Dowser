[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dowser"
version = "0.1.0"
description = "Find the Game Boy memory address behind a number, and write the code that pins it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob Silva" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
dowser = "dowser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dowser"]
artifacts = ["src/dowser/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
