<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dowser</title>
<style>
  :root {
    --bg: #0b0d0c;
    --panel: #121614;
    --line: rgba(255,255,255,.08);
    --ink: #e8ece8;
    --dim: rgba(232,236,232,.58);
    --faint: rgba(232,236,232,.34);
    /* The console's own green, desaturated far enough to sit under text. */
    --accent: #9bbc5a;
    --accent-dim: rgba(155,188,90,.14);
    --warn: #d98a4b;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 26px 20px 60px; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .sub { color: var(--faint); font-size: 13px; }

  .status {
    display: flex; align-items: center; gap: 8px; margin: 14px 0 22px;
    font-size: 13px; color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .game { font-family: var(--mono); color: var(--ink); }

  .panel {
    background: var(--panel); border: .5px solid var(--line);
    border-radius: 12px; padding: 18px; margin-bottom: 14px;
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--faint); margin: 0 0 14px; font-weight: 600;
  }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }

  input[type=number] {
    background: #0a0c0b; border: .5px solid var(--line); color: var(--ink);
    border-radius: 9px; padding: 10px 12px; font-family: var(--mono);
    font-size: 16px; width: 108px; -moz-appearance: textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  button {
    background: #1b201d; border: .5px solid var(--line); color: var(--ink);
    border-radius: 9px; padding: 9px 14px; font-size: 14px; font-family: inherit;
    cursor: pointer; transition: background .15s ease, border-color .15s ease;
  }
  button:hover:not(:disabled) { background: #232925; border-color: rgba(255,255,255,.18); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary { background: var(--accent-dim); border-color: rgba(155,188,90,.4); color: var(--accent); }
  button.primary:hover:not(:disabled) { background: rgba(155,188,90,.22); }
  button.warn { color: var(--warn); border-color: rgba(217,138,75,.34); }
  button.tiny { padding: 5px 10px; font-size: 12px; }

  .count { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .count b {
    font-family: var(--mono); font-size: 34px; font-weight: 600;
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .count span { color: var(--faint); font-size: 13px; }
  .count.solved b { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th {
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: .09em; color: var(--faint); font-weight: 600;
    padding: 0 10px 8px 0;
  }
  td { padding: 7px 10px 7px 0; border-top: .5px solid var(--line); font-size: 14px; }
  td.addr { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.where { color: var(--dim); font-family: var(--mono); font-size: 13px; }
  td.val { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--accent); }
  td.act { text-align: right; padding-right: 0; }
  tr.frozen td.addr::after {
    content: "held"; margin-left: 9px; font-family: var(--ui); font-size: 10px;
    text-transform: uppercase; letter-spacing: .08em; color: var(--warn);
  }

  ol { margin: 0; padding-left: 20px; color: var(--dim); font-size: 13.5px; }
  ol li { margin: 3px 0; }
  ol b { color: var(--ink); font-weight: 500; }
  ol .n { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .hint { color: var(--faint); font-size: 12.5px; margin-top: 12px; }
  .msg {
    margin-top: 12px; font-size: 13px; color: var(--warn);
    min-height: 1.4em;
  }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dowser</h1>
    <span class="sub">find the address behind a number</span>
  </header>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="conn">looking for Cartridge…</span>
    <span class="game" id="title"></span>
  </div>

  <div class="panel">
    <h2>The value is</h2>
    <div class="row">
      <input type="number" id="value" placeholder="47" min="0" />
      <button class="primary" data-f="equals" data-v>now this</button>
      <button data-f="less-than" data-v>less than this</button>
      <button data-f="greater-than" data-v>more than this</button>
      <button data-f="not-equals" data-v>not this</button>
    </div>
    <div class="row">
      <button data-f="decreased" id="b-dec">it went down</button>
      <button data-f="increased">it went up</button>
      <button data-f="changed">it changed</button>
      <button data-f="unchanged">it didn't change</button>
    </div>
    <div class="row">
      <input type="number" id="delta" placeholder="12" min="0" />
      <button data-f="decreased-by" data-d>down by this</button>
      <button data-f="increased-by" data-d>up by this</button>
      <span style="flex:1"></span>
      <button id="reset">Start over</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel">
    <h2>Candidates</h2>
    <div class="count" id="count"><b>—</b><span>nothing searched yet</span></div>
    <div id="list"></div>
    <div class="row" id="freezeRow" style="margin-top:14px; display:none">
      <input type="number" id="freezeValue" placeholder="151" min="0" />
      <button class="primary" id="freezeAll">Hold all at this</button>
      <button class="warn" id="thaw">Release</button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="panel" id="historyPanel" style="display:none">
    <h2>Rounds</h2>
    <ol id="history"></ol>
  </div>

</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
let state = { remaining: 0, started: false, candidates: [], frozen: [], history: [] };

const say = (text, bad = true) => {
  const el = $("msg");
  el.textContent = text || "";
  el.style.color = bad ? "var(--warn)" : "var(--faint)";
};

async function call(path, body) {
  const options = body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {};
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || `${response.status}`);
  return data;
}

function render(next) {
  if (next) state = Object.assign(state, next);

  if ("connected" in state) {
    $("dot").classList.toggle("on", !!state.connected);
    $("conn").textContent = state.connected ? "connected to" : "Cartridge isn't listening";
    $("title").textContent = state.connected ? (state.title || "") : "";
    if (!state.connected) {
      $("title").textContent = "";
      $("conn").textContent = "Cartridge isn't listening — turn on Settings › Advanced › Cheat Search";
    }
  }

  // Relative filters need something to compare against.
  document.querySelectorAll("button[data-f]").forEach((b) => {
    const relative = ["decreased","increased","changed","unchanged","decreased-by","increased-by"]
      .includes(b.dataset.f);
    b.disabled = relative && !state.started;
  });

  const count = $("count");
  const solved = state.started && state.remaining === 1;
  count.classList.toggle("solved", solved);
  count.innerHTML = state.started
    ? `<b>${state.remaining.toLocaleString()}</b><span>${
        state.remaining === 1 ? "found it" : "addresses still possible"}</span>`
    : `<b>—</b><span>nothing searched yet</span>`;

  const frozen = new Set(state.frozen.map((f) => f.address));
  const list = $("list");

  if (!state.started || state.remaining === 0) {
    list.innerHTML = "";
  } else if (state.candidates.length === 0) {
    list.innerHTML = "";
    $("hint").textContent = "Too many to show. Give it another round.";
  } else {
    list.innerHTML = `<div class="scroll"><table>
      <thead><tr><th>Address</th><th>Where</th><th>Value</th><th></th></tr></thead>
      <tbody>${state.candidates.map((c) => `
        <tr class="${frozen.has(c.address) ? "frozen" : ""}">
          <td class="addr">$${c.hex}</td>
          <td class="where">${c.label}</td>
          <td class="val">${c.value}</td>
          <td class="act"><button class="tiny" data-hold="${c.address}">Hold</button></td>
        </tr>`).join("")}</tbody></table></div>`;
    $("hint").textContent = state.candidates.length > 1
      ? "Several addresses can hold the same value. Hold them all, see if the game changes, then halve the list."
      : "";
  }

  $("freezeRow").style.display =
    state.started && state.remaining > 0 && state.remaining <= 8 ? "flex" : "none";

  $("historyPanel").style.display = state.history.length ? "block" : "none";
  $("history").innerHTML = state.history
    .map((r) => `<li><b>${r.filter}</b> — <span class="n">${r.remaining.toLocaleString()}</span> left</li>`)
    .join("");
}

async function scan(filter, value) {
  say("");
  try {
    render(await call("/api/scan", { filter, value }));
  } catch (error) {
    say(error.message);
  }
}

document.querySelectorAll("button[data-f]").forEach((button) => {
  button.addEventListener("click", () => {
    const filter = button.dataset.f;
    let value = null;
    if ("v" in button.dataset) {
      value = parseInt($("value").value, 10);
      if (Number.isNaN(value)) return say("Type the number you can see first.");
    }
    if ("d" in button.dataset) {
      value = parseInt($("delta").value, 10);
      if (Number.isNaN(value)) return say("Type how much it moved by.");
    }
    scan(filter, value);
  });
});

// Return in the value box is the commonest action, so it does the commonest thing.
$("value").addEventListener("keydown", (event) => {
  if (event.key === "Enter") scan("equals", parseInt($("value").value, 10));
});

$("reset").addEventListener("click", async () => {
  render(await call("/api/session", { width: 8 }));
  say("");
});

$("list").addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-hold]");
  if (!button) return;
  const value = parseInt($("freezeValue").value, 10);
  if (Number.isNaN(value)) return say("Put a value in the box first.");
  try {
    render(await call("/api/freeze", { value, address: parseInt(button.dataset.hold, 10) }));
    say("");
  } catch (error) { say(error.message); }
});

$("freezeAll").addEventListener("click", async () => {
  const value = parseInt($("freezeValue").value, 10);
  if (Number.isNaN(value)) return say("Put a value in the box first.");
  try {
    render(await call("/api/freeze", { value }));
    say("");
  } catch (error) { say(error.message); }
});

$("thaw").addEventListener("click", async () => {
  try { render(await call("/api/thaw", {})); say(""); }
  catch (error) { say(error.message); }
});

async function poll() {
  try { render(await call("/api/status")); } catch { /* server restarting */ }
}
poll();
setInterval(poll, 2500);
render();
</script>
</body>
</html>
